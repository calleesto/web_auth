<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>web_auth</title>
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <!--Test: "POST /login" && "POST /logout" && "GET /auth/login-google" && "GET /auth/logout-google"-->
    <header class="header">
        <h1 class="title">web_auth</h1>
        <button id="logInOrOutBtn" onClick="loginButtonLogic()">Log In</button>
    </header>

    <main class="main">
        <!--Test: "GET /api/public"-->
        <section id="publicTest">
            <h2>Public Data</h2>
            <p class="section-description">Information available without logging in.</p>
            <ul>
                <li></li> <!-- public value 1-->
                <li></li> <!-- public value 2-->
            </ul>
        </section>

        <section id="profileFetcher"> <!-- admins can fetch all ids; regular users only their own-->
            <h2>Fetch Profile</h2>
            <p class="section-description">Enter a user ID to view profile information.</p>
            <input type="number" min="0" step="1" placeholder="Enter user ID" id="idFetchInput" required>
            <button id="getProfile">Get Profile</button>
            <p id="fetchOutput" class="output"></p> <!--shows either profile info json or 403 forbidden error-->
        </section>

        <!--Test: "DELETE /api/user/{id}"-->
        <section id="adminDelete">
            <h2>Delete User</h2>
            <p class="section-description">Admin-only action for removing a user profile.</p>
            <input type="number" min="0" step="1" placeholder="Enter user ID" id="idDeleteInput" required>
            <button id="deleteProfile">Delete Profile</button>
            <p id="deleteOutput" class="output"></p> <!--shows either profile delete success message or 403 forbidden error-->
        </section>

        <!--Test: "POST /api/logs"-->
        <section id="submitLogs">
            <h2>Submit Logs</h2>
            <p class="section-description">Submit server logs if your account has permission.</p>
            <button id="submitLogsBtn">Submit Logs</button>
            <p id="logsOutput" class="output"></p> <!--must be admin and server hour between StartHour and EndHour or 403 forbidden error-->
        </section>
    </main>

    <script src="index.js"></script>
    <script src="../api.js"></script>
</body>
</html>
